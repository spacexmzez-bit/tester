name = "play-tester-sync"
main = "worker.js"
compatibility_date = "2024-01-01"

# Workers KV binding for storing synced JSON data per user passkey
# To create the KV namespace run:
#   npx wrangler kv:namespace create PLAY_TESTER_KV
# Then paste the returned ID below:
[[kv_namespaces]]
binding = "PLAY_TESTER_KV"
id = "f618ebe199fc4973ae9f6f2bf47334a8"
preview_id = "f618ebe199fc4973ae9f6f2bf47334a8"

[observability]
enabled = true
