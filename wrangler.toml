name = "play-tester-sync"
main = "worker.js"
compatibility_date = "2024-01-01"

# Workers KV binding for storing synced JSON data per user passkey
# To create the KV namespace run:
#   npx wrangler kv:namespace create PLAY_TESTER_KV
# Then paste the returned ID below:
[[kv_namespaces]]
binding = "PLAY_TESTER_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"
preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID_HERE"

[observability]
enabled = true
